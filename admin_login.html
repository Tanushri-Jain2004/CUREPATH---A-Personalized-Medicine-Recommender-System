<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login — CurePath</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--t50:#E1F5EE;--t100:#9FE1CB;--t400:#1D9E75;--t600:#0F6E56;--t800:#085041;--t900:#04342C;--font-d:'Playfair Display',serif;--font-b:'DM Sans',sans-serif;}
body{font-family:var(--font-b);background:#f4f5f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-wrap{width:100%;max-width:400px;}
.login-card{background:#fff;border:1px solid #e8e6df;border-radius:18px;overflow:hidden;}
.login-header{background:var(--t900);padding:32px 36px 28px;position:relative;overflow:hidden;}
.login-header::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;background:rgba(29,158,117,0.15);border-radius:50%;}
.login-header::after{content:'';position:absolute;bottom:-30px;left:20px;width:100px;height:100px;background:rgba(29,158,117,0.08);border-radius:50%;}
.lh-icon{width:48px;height:48px;background:rgba(255,255,255,0.1);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;position:relative;z-index:1;}
.lh-icon svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;}
.login-header h1{font-family:var(--font-d);font-size:22px;font-weight:700;color:#fff;margin-bottom:4px;position:relative;z-index:1;}
.login-header p{font-size:12.5px;color:rgba(255,255,255,0.55);position:relative;z-index:1;}
.login-body{padding:28px 36px 32px;}
.alert-error{background:#fff0f0;border:1px solid #f09595;color:#a32d2d;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:18px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:11px;font-weight:700;color:#5f5e5a;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;}
.field input{width:100%;padding:11px 14px;border:1.5px solid #e8e6df;border-radius:9px;font-family:var(--font-b);font-size:14px;color:#2c2c2a;outline:none;background:#faf9f6;transition:border-color 0.2s;}
.field input:focus{border-color:var(--t400);background:#fff;}
.field input::placeholder{color:#b4b2a9;}
.submit-btn{width:100%;padding:13px;background:var(--t600);color:#fff;border:none;border-radius:10px;font-family:var(--font-b);font-size:15px;font-weight:600;cursor:pointer;transition:background 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.submit-btn:hover{background:var(--t800);}
.submit-btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;}
.back-link{display:block;text-align:center;margin-top:18px;font-size:13px;color:#888780;text-decoration:none;transition:color 0.15s;}
.back-link:hover{color:var(--t600);}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <div class="lh-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1>Admin Panel</h1>
      <p>Sign in to manage CurePath data</p>
    </div>
    <div class="login-body">
      {% if error %}
        <div class="alert-error">{{ error }}</div>
      {% endif %}
      <form method="POST">
        <div class="field">
          <label>Admin Username</label>
          <input type="text" name="username" placeholder="Enter username" required autocomplete="username">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" class="submit-btn">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Sign In to Admin
        </button>
      </form>
      <a href="/" class="back-link">← Back to CurePath website</a>
    </div>
  </div>
</div>
</body>
</html>
